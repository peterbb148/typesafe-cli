name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.22'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Check tag matches package version
        run: uv run python -c "import os; from typesafe_cli import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: uv run python scripts/package_release.py
      - name: Publish all validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "typesafe-cli $GITHUB_REF_NAME" --notes-file CHANGELOG.md
