name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            python: '3.12'
            target: linux-arm64
          - os: macos-14
            python: '3.12'
            target: macos-arm64
          - os: windows-2022
            python: '3.12'
            target: windows-x86_64
          - os: ubuntu-24.04
            python: '3.13'
          - os: ubuntu-24.04
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.22'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python scripts/smoke_wheel.py
      - if: matrix.target
        run: uv run python scripts/build_binary.py --target ${{ matrix.target }}
      - if: matrix.target
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/typesafe-cli-*.tar.gz
            dist/typesafe-cli-*.zip
          if-no-files-found: error
      - if: matrix.target == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/typesafe_cli-*.tar.gz
          if-no-files-found: error
