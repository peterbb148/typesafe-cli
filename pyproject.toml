[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "typesafe-cli"
dynamic = ["version"]
description = "Compose TypeSafe evaluations through JSON"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["typer==0.27.2", "typesafe-sdk==0.7.0", "pywin32==311; sys_platform == 'win32'"]

[project.scripts]
typesafe-cli = "typesafe_cli.cli:app"

[tool.hatch.version]
path = "src/typesafe_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/typesafe_cli"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "pyinstaller==6.22.3", "pyyaml>=6,<7"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
